<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="极巨大冒险计数器">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d12"/>
      <stop offset="1" stop-color="#1c2030"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ab8ff"/>
      <stop offset="1" stop-color="#2d6bb3"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#4a9eff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#4a9eff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- 精灵球外环 -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="url(#ring)" stroke-width="22"/>
  <!-- 中缝 -->
  <line x1="88" y1="256" x2="424" y2="256" stroke="url(#ring)" stroke-width="22" stroke-linecap="round"/>
  <!-- 中心按钮 -->
  <circle cx="256" cy="256" r="52" fill="#0b0d12" stroke="url(#ring)" stroke-width="18"/>
  <circle cx="256" cy="256" r="16" fill="#eef0f6" opacity="0.9"/>

  <!-- 金色闪光 -->
  <path d="M392 108 L402 138 L432 148 L402 158 L392 188 L382 158 L352 148 L382 138 Z" fill="#ffd54a"/>
  <path d="M120 372 L126 392 L146 398 L126 404 L120 424 L114 404 L94 398 L114 392 Z" fill="#ffd54a" opacity="0.85"/>
  <circle cx="404" cy="316" r="7" fill="#ffd54a" opacity="0.8"/>
  <circle cx="108" cy="168" r="5" fill="#6ab8ff" opacity="0.9"/>
</svg>
